[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "2.0.0"
description = "A Python tool to analyze phishing email headers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "xhtml2pdf>=0.2.14",
    "beautifulsoup4>=4.12",
]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools]
packages = ["phishguard"]
