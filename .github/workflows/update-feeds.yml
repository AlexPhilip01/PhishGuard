name: Update threat-feed snapshot

# Publishes a compact fingerprint snapshot of the live phishing feed to the
# `feed-data` branch, which the website (index.html) loads in the browser.
# The branch is replaced with a single commit on every run, so the repository
# never accumulates history from the ~2 MB binary.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      feeds:
        description: "Comma-separated feeds (openphish is non-commercial use only)"
        default: "phishing-database"

permissions:
  contents: write

concurrency:
  group: feed-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PhishGuard
        run: pip install -e .

      - name: Build snapshot
        run: phishguard build-snapshot --out snapshot --feeds "${{ inputs.feeds || 'phishing-database' }}"

      - name: Publish to the feed-data branch
        run: |
          set -euo pipefail
          cd snapshot
          git init -q -b feed-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phishguard-feed.bin feed-meta.json
          git commit -q -m "Feed snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin feed-data
